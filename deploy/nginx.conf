# nginx configuration for the SHLoupe image.
#
# Copied to /etc/nginx/conf.d/default.conf, replacing the stock server block.
# conf.d is included from inside http {}, so `map` and `log_format` below are in
# a legal context here.

# ---------------------------------------------------------------------------
# Cache-Control as a variable, so every response header can be emitted from ONE
# add_header set at server level.
#
# This is not a style choice. nginx's add_header does not merge across levels: a
# location that declares any add_header of its own DISCARDS every add_header it
# would have inherited from the server block. Setting Cache-Control inside
# `location /assets/` would therefore silently strip the whole CSP and security
# header set from exactly the files that most need it.
# ---------------------------------------------------------------------------
map $uri $loupe_cache_control {
    # index.html and anything reached through the SPA fallback: revalidate every
    # load, so a redeploy is picked up without the hard refresh nobody thinks to
    # do while standing at a table with a queue behind them.
    default      "no-cache";
    # Vite's hashed output. The filename changes when the bytes change, which is
    # the only situation where `immutable` is an honest claim.
    "~^/assets/" "public, max-age=31536000, immutable";
}

# Access log without the query string. A SMART Health Link carries the payload's
# decryption key. Browsers never send a fragment, so the `#shlink:/...` form
# cannot reach a log; but any `?shl=` style convenience parameter would land in
# $request under the default `combined` format. $uri is the normalised path with
# the query string already removed.
log_format loupe_noquery '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                         '$status $body_bytes_sent $request_time';

server {
    # IPv4 only, deliberately. kubectl port-forward reaches the container from
    # inside the pod's own network namespace over loopback, and a `listen
    # [::]:8080` that fails to bind takes the entire server down with it.
    listen      8080;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    access_log    /dev/stdout loupe_noquery;
    server_tokens off;
    charset       utf-8;

    # The pod's idea of its own host and port is not the browser's when a
    # port-forward is in the middle, so any redirect nginx generates itself is
    # emitted as a path rather than as an absolute URL.
    absolute_redirect off;

    # ---------------- compression ----------------
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    # text/html is always compressed and must not be listed here.
    gzip_types      text/plain text/css application/javascript application/json
                    application/manifest+json image/svg+xml application/wasm;
    # Prefer the .gz files the build stage produced over compressing the same
    # bytes on every request. Available in this image: pkg-oss builds nginx with
    # --with-http_gzip_static_module.
    gzip_static     on;
    #
    # Brotli is NOT enabled, and pasting `brotli on;` here sends the pod straight
    # to CrashLoopBackOff: it is not a built-in directive and nginx treats an
    # unknown directive as a fatal configuration error. nginx does publish an
    # Alpine module (apk nginx-module-brotli), but its two load_module lines are
    # main-context directives that have to be prepended to nginx.conf in a root
    # layer, and they cannot live in conf.d. For a bundle of this size served
    # over a port-forward it buys nothing.

    # ---------------- one header set, server level ----------------
    add_header Cache-Control              $loupe_cache_control always;
    add_header X-Content-Type-Options     "nosniff"            always;
    add_header Referrer-Policy            "no-referrer"        always;
    add_header X-Frame-Options            "DENY"               always;
    add_header Cross-Origin-Opener-Policy "same-origin"        always;

    # camera=(self) is load bearing, not decoration: scanning a SMART Health Link
    # QR code calls getUserMedia, and camera=() would kill it with a message that
    # reads as a broken camera. Everything else is off.
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), display-capture=(), serial=(), bluetooth=(), idle-detection=()" always;

    # ---------------- Content-Security-Policy ----------------
    #
    # Written as one line on purpose. A backslash-continued quoted string is not
    # something nginx's parser promises to handle, and a real newline inside the
    # quotes would be sent verbatim in the header value.
    #
    # The honest tension, stated here rather than papered over: connect-src
    # cannot be the control that contains an XSS in this app. SHLoupe's whole job
    # is to fetch arbitrary third-party origins that arrive inside somebody
    # else's link, so any connect-src tight enough to matter would break the
    # product. What contains an XSS instead is script-src, which is strict.
    #
    # Per directive:
    #   default-src 'none'      a directive nobody thought about fails closed.
    #   script-src 'self'       no 'unsafe-inline', no 'unsafe-eval'. This is the
    #                           directive that decides whether attacker-supplied
    #                           JavaScript can run at all, and it is tight.
    #     'wasm-unsafe-eval'    the exact token zxing-wasm's
    #                           WebAssembly.instantiateStreaming needs for the QR
    #                           scanner. It permits WASM compilation WITHOUT
    #                           re-enabling JavaScript eval.
    #   style-src 'self' 'unsafe-inline'
    #                           the one concession. React style props become style
    #                           ATTRIBUTES, which CSP charges to style-src-attr
    #                           and, where that is unsupported, to style-src; the
    #                           primitives use them (CodeBlock's max height). An
    #                           inline-style hole is far smaller than an
    #                           inline-script one. Tailwind itself needs nothing
    #                           here: @tailwindcss/vite emits a linked stylesheet.
    #   img-src 'self' data: blob:
    #                           https: is deliberately EXCLUDED. A FHIR
    #                           Attachment.url or Patient.photo pointing at a
    #                           remote image would otherwise be an uncontrolled
    #                           beacon that fires just from rendering somebody's
    #                           payload. Remote images are fetched only on an
    #                           explicit action, through the traced transport,
    #                           and displayed from a blob:.
    #   font-src 'self'         the Geist faces are bundled. No CDN, ever.
    #   connect-src 'self' https: http: data: blob:
    #                           https: for manifest POSTs and files[].location
    #                           GETs. http: because refusing it would turn the
    #                           motivating incident (a link pointing at
    #                           http://localhost:5173) into an indistinguishable
    #                           CSP violation instead of a diagnosable network
    #                           error: a page served from http://localhost:8080
    #                           has no mixed-content blocking, so those fetches
    #                           genuinely work and the tool can report the real
    #                           failure. data:/blob: for pasted payloads and
    #                           object URLs. Note this is genuinely narrower than
    #                           `*`, not merely more verbose: CSP3 excludes
    #                           non-network schemes from `*` (so `*` would NOT
    #                           cover data:/blob:) while it WOULD cover ws:/wss:,
    #                           which this app never uses.
    #   worker-src 'self' blob: the decoder runs in a worker created from a blob.
    #   frame-src blob:         the PDF preview iframe renders decrypted bytes
    #                           from an object URL. With default-src 'none' and
    #                           no frame-src, that iframe is blocked outright.
    #   object-src 'none'       no <object>/<embed>, so the iframe above is the
    #                           only path a PDF can render through.
    #   base-uri 'self'         blocks an injected <base> repointing every
    #                           relative asset at another origin.
    #   form-action 'none'      nothing here posts a form anywhere.
    #   frame-ancestors 'none'  nobody frames SHLoupe, so a decrypt button cannot
    #                           be clickjacked. X-Frame-Options above says the
    #                           same thing for anything that predates CSP2.
    #
    # About the PDF preview iframe's own sandbox attribute, since CSP is only
    # half of it: keep `sandbox` on that iframe, and do NOT write
    # `allow-scripts allow-same-origin` together. A blob: URL inherits this
    # page's origin, and the HTML standard is explicit that those two keywords
    # combined on same-origin content let the framed document remove its own
    # sandbox attribute and reload, which is the whole sandbox gone. Chromium's
    # built-in viewer is script driven, so verify what renders per engine and, if
    # a bare sandbox will not display the document, offer the file as a download
    # or a new tab rather than granting allow-same-origin.
    #
    # Not set, each for a reason:
    #   Strict-Transport-Security: RFC 6797 section 7.2 says an HSTS host MUST
    #     NOT send it over non-secure transport, and section 8.1 has the user
    #     agent ignore it anyway. The gateway adds HSTS for apps that have a
    #     hostname; this one has none.
    #   Cross-Origin-Embedder-Policy: require-corp would break loading any
    #     third-party subresource and buys nothing without SharedArrayBuffer.
    #   require-trusted-types-for: worth adding once the DOM sinks are settled.
    #     It is the strongest defence available to a tool whose entire input is
    #     untrusted third-party JSON being rendered into the DOM. There is no
    #     report endpoint (no backend), so it gets validated by watching the
    #     console, not by report-only telemetry.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https: http: data: blob:; worker-src 'self' blob:; frame-src blob:; manifest-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;

    # ---------------- routing ----------------
    # A hashed asset either exists or 404s. NEVER let this fall through to the
    # SPA fallback. A stale or renamed chunk answered with index.html at HTTP 200
    # produces "Failed to load module script: Expected a JavaScript module script
    # but the server responded with a MIME type of text/html", which reads as a
    # bundler bug and is really a server-configuration bug.
    location /assets/ {
        try_files $uri =404;
    }

    # Liveness and readiness. Deliberately not logged: two probes every ten
    # seconds would bury the request that is actually being debugged.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # SPA history fallback.
    #
    # It is insurance, not load bearing, and that is the intended state. SHLoupe
    # keeps all of its routing in the fragment (`#shlink:/...`, `#/learn`)
    # because a SMART Health Link carries a decryption key and a fragment is
    # never sent to a server, so there are no path routes to fall back FOR. That
    # is also what lets vite.config.ts keep `base: './'` and emit relative asset
    # URLs, which is what makes the same dist/ work under a path prefix and from
    # file://.
    #
    # The trap if that ever changes: with `base: './'` AND a real path route, a
    # request for /trace/abcd returns index.html, the browser resolves
    # ./assets/index-HASH.js against /trace/, asks for /trace/assets/index-HASH.js,
    # which `location /assets/` never matches, and gets index.html back with the
    # MIME error quoted above. Add path routes and `base` must become '/' in the
    # same change.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
